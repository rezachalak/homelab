apiVersion: apps/v1
kind: Deployment
metadata:
  name: kea-dhcp4
  namespace: kea
  labels:
    app.kubernetes.io/name: kea-dhcp4
spec:
  # Exactly one DHCP server: two would race each other over the same
  # broadcast domain and the same lease file.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: kea-dhcp4
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kea-dhcp4
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      automountServiceAccountToken: false
      enableServiceLinks: false
      nodeSelector:
        kubernetes.io/hostname: talos-ja7-fcz
      priorityClassName: system-cluster-critical
      securityContext:
        # The image's binary is mode 0754 kea:kea; group 101 lets us exec it
        # without CAP_DAC_OVERRIDE.
        supplementalGroups: [ 101 ]
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: kea-dhcp4
          image: docker.cloudsmith.io/isc/docker/kea-dhcp4:3.2.1-20260930@sha256:946be1df56856233f75443a61fd49c030daa9b07f183d68d5f9153637bb8c266
          command: [ "/usr/sbin/kea-dhcp4", "-c", "/etc/kea/kea-dhcp4.conf" ]
          securityContext:
            # Runs as uid 0 *inside the container only* because containerd
            # gives a non-root process no effective capabilities (no ambient
            # caps), and Kea needs NET_BIND_SERVICE for port 67. NET_RAW is
            # not used (udp socket mode) but must stay in the bounding set:
            # the image ships kea-dhcp4 with file caps that include it, and the
            # kernel refuses to exec the binary otherwise. Everything else is
            # dropped, so this root has no DAC override, no setuid, etc.
            runAsUser: 0
            runAsGroup: 101
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ ALL ]
              add: [ NET_BIND_SERVICE, NET_RAW ]
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          livenessProbe:
            exec:
              command: [ "test", "-S", "/var/run/kea/kea4-ctrl-socket" ]
            initialDelaySeconds: 30
            periodSeconds: 30
          volumeMounts:
            - name: config
              mountPath: /etc/kea
              readOnly: true
            - name: leases
              mountPath: /var/lib/kea
            - name: run
              mountPath: /var/run/kea
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: kea-dhcp4
            items:
              - key: kea-dhcp4.json
                path: kea-dhcp4.conf
        - name: leases
          persistentVolumeClaim:
            claimName: kea-leases
        - name: run
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi
        - name: tmp
          emptyDir:
            sizeLimit: 16Mi
