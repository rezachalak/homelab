apiVersion: v1
kind: Namespace
metadata:
  name: kea
  labels:
    # Kea runs on the node's network (hostNetwork) so the AP's relayed DHCP
    # requests reach it on 192.168.25.25:67 and replies route back via the AP.
    # hostNetwork is forbidden by the cluster-wide "baseline" default, so this
    # namespace is privileged - the pod itself drops everything else.
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/warn: baseline
    pod-security.kubernetes.io/audit: baseline
