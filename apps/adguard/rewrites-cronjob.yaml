apiVersion: batch/v1
kind: CronJob
metadata:
  name: adguard-rewrites-reconcile
  namespace: adguard
spec:
  schedule: "*/5 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: 3600
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: reconcile
              image: python:3.13-alpine
              command:
                - python3
                - -c
                - |
                  import json, urllib.request

                  base = "http://adguard-home.adguard.svc.cluster.local"

                  with open("/config/rewrites.txt") as f:
                      desired = [
                          line.split() for line in f
                          if line.strip() and not line.strip().startswith("#")
                      ]

                  with urllib.request.urlopen(f"{base}/control/rewrite/list") as resp:
                      existing = {(e["domain"], e["answer"]) for e in json.load(resp)}

                  for domain, answer in desired:
                      if (domain, answer) in existing:
                          print(f"ok: {domain} -> {answer}")
                          continue
                      req = urllib.request.Request(
                          f"{base}/control/rewrite/add",
                          data=json.dumps({"domain": domain, "answer": answer}).encode(),
                          headers={"Content-Type": "application/json"},
                          method="POST",
                      )
                      urllib.request.urlopen(req)
                      print(f"added: {domain} -> {answer}")
              volumeMounts:
                - name: rewrites
                  mountPath: /config
              securityContext:
                allowPrivilegeEscalation: false
                seccompProfile:
                  type: RuntimeDefault
                readOnlyRootFilesystem: true
                runAsNonRoot: true
                runAsUser: 65534
                capabilities:
                  drop: ["ALL"]
          volumes:
            - name: rewrites
              configMap:
                name: adguard-rewrites
