apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
kind: OpenStackMachineTemplate
metadata:
  name: talos-lab-md-0
  namespace: talos-lab-cluster
spec:
  template:
    spec:
      flavor: m1.small
      image:
        filter:
          name: talos-1.13.10
---
apiVersion: bootstrap.cluster.x-k8s.io/v1alpha3
kind: TalosConfigTemplate
metadata:
  name: talos-lab-md-0
  namespace: talos-lab-cluster
spec:
  template:
    spec:
      generateType: join
      talosVersion: v1.13.10
---
apiVersion: cluster.x-k8s.io/v1beta2
kind: MachineDeployment
metadata:
  name: talos-lab-md-0
  namespace: talos-lab-cluster
spec:
  clusterName: talos-lab
  replicas: 1
  selector:
    matchLabels:
      cluster.x-k8s.io/cluster-name: talos-lab
      cluster.x-k8s.io/deployment-name: talos-lab-md-0
  template:
    metadata:
      labels:
        cluster.x-k8s.io/cluster-name: talos-lab
        cluster.x-k8s.io/deployment-name: talos-lab-md-0
    spec:
      clusterName: talos-lab
      version: v1.32.4
      bootstrap:
        configRef:
          apiGroup: bootstrap.cluster.x-k8s.io
          kind: TalosConfigTemplate
          name: talos-lab-md-0
      infrastructureRef:
        apiGroup: infrastructure.cluster.x-k8s.io
        kind: OpenStackMachineTemplate
        name: talos-lab-md-0
