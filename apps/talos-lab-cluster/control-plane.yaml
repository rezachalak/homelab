apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
kind: OpenStackMachineTemplate
metadata:
  # OpenStackMachineTemplate.spec is immutable - changing the flavor
  # requires a new object (see https://cluster-api.sigs.k8s.io/tasks/change-machine-template.html),
  # referenced below by TalosControlPlane.spec.infrastructureTemplate.
  name: talos-lab-control-plane-v2
  namespace: talos-lab-cluster
spec:
  template:
    spec:
      # m1.small (1 vCPU) was too tight for etcd+apiserver+scheduler+
      # controller-manager to bootstrap reliably - etcd got stuck
      # indefinitely in a "Preparing" pre-state under CPU starvation.
      flavor: m1.medium
      image:
        filter:
          name: talos-1.13.10
---
apiVersion: controlplane.cluster.x-k8s.io/v1alpha3
kind: TalosControlPlane
metadata:
  name: talos-lab-control-plane
  namespace: talos-lab-cluster
spec:
  replicas: 1
  version: v1.32.4
  infrastructureTemplate:
    apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
    kind: OpenStackMachineTemplate
    name: talos-lab-control-plane-v2
  controlPlaneConfig:
    controlplane:
      generateType: controlplane
      talosVersion: v1.13.10
