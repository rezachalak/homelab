apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - repository.yaml
  - release.yaml
  - networkpolicy.yaml
configMapGenerator:
  - name: renovate-github-app-token
    namespace: renovate
    files:
      - github-app-token.mjs
    options:
      # Referenced by a fixed name from the HelmRelease values.
      disableNameSuffixHash: true
