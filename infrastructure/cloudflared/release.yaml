apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cloudflared
  namespace: cloudflared
spec:
  interval: 1h
  chart:
    spec:
      chart: cloudflare-tunnel-remote
      sourceRef:
        kind: HelmRepository
        name: cloudflare
  # The real tunnel token stays in the existing `cloudflared-token` Secret (created
  # outside of Flux) and is injected at render time — it is never written to git.
  valuesFrom:
    - kind: Secret
      name: cloudflared-token
      valuesKey: TUNNEL_TOKEN
      targetPath: cloudflare.tunnel_token
  values:
    replicaCount: 2
    image:
      tag: "2026.8.2"
