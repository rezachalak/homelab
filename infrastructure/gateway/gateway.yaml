apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: gateway
  namespace: kube-system
spec:
  gatewayClassName: cilium
  infrastructure:
    annotations:
      lbipam.cilium.io/ips: "192.168.25.101"
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      # Only namespaces that opt in with this label may attach routes; with "All" any
      # namespace could publish a hostname on the LAN gateway.
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              gateway.rezoreyz.lan/routes: allowed
