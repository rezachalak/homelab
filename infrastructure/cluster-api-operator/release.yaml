apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: capi-operator
  namespace: capi-operator-system
spec:
  interval: 1h
  driftDetection:
    mode: enabled
  dependsOn:
    - name: cert-manager
      namespace: cert-manager
  chart:
    spec:
      chart: cluster-api-operator
      version: "0.29.0"
      sourceRef:
        kind: HelmRepository
        name: capi-operator
  values:
    # The chart ships empty security contexts; this is what PodSecurity "restricted"
    # (enforced on the namespace) requires. The image is distroless/nonroot.
    securityContext:
      runAsNonRoot: true
      runAsUser: 65532
      runAsGroup: 65532
      seccompProfile:
        type: RuntimeDefault
    containerSecurityContext:
      manager:
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
