# Default-deny for the Cluster API controllers (they will hold OpenStack credentials
# once a workload cluster exists). Derived from Hubble flows; every namespace gets:
#   in:  the API server (admission/conversion webhooks on :9443) and kubelet probes
#   out: the API server, cluster DNS, and the outside world
# "world" is needed for provider manifests from GitHub (operator) and for the OpenStack
# APIs, workload-cluster API servers and Talos APIs (providers, ORC). It still blocks
# lateral movement to other pods/services in this cluster. Narrow it to the OpenStack
# CIDR (toCIDR) once the target environment is fixed.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: capi-operator-system
  namespace: capi-operator-system
spec:
  endpointSelector: {}
  ingress:
    - fromEntities:
        - kube-apiserver
        - host
  egress:
    - toEntities:
        - kube-apiserver
      toPorts:
        - ports:
            - port: "6443"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
    - toEntities:
        - world
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
---
