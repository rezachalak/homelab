# No packaged Helm repo is published for the official chart (upstream only documents
# `git clone` + local `helm install`), so we source it straight from the GitHub repo.
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: local-path-provisioner
  namespace: local-path-storage
spec:
  interval: 1h
  url: https://github.com/rancher/local-path-provisioner
  ref:
    tag: v0.0.37
