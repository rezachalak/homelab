apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: local-path-provisioner
  namespace: local-path-storage
spec:
  interval: 1h
  chart:
    spec:
      chart: ./deploy/chart/local-path-provisioner
      sourceRef:
        kind: GitRepository
        name: local-path-provisioner
  values:
    storageClass:
      create: true
      defaultClass: true
      name: local-path
    # /var/mnt/data is the dedicated 322GB disk (/dev/sdb) already provisioned via the
    # Talos UserVolumeConfig "data" in my-talos/controlplane.yaml.
    nodePathMap:
      - node: DEFAULT_PATH_FOR_NON_LISTED_NODES
        paths:
          - /var/mnt/data/local-path-provisioner
