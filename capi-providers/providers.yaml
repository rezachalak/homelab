# CAPI provider components, installed declaratively by the cluster-api-operator
# (see release.yaml). "openstack" is a built-in provider name the operator
# resolves automatically; the Talos providers are not, so they need an explicit
# fetchConfig pointing at siderolabs' release manifests.
apiVersion: operator.cluster.x-k8s.io/v1alpha2
kind: CoreProvider
metadata:
  name: cluster-api
  namespace: capi-system
spec:
  # renovate: datasource=github-releases depName=kubernetes-sigs/cluster-api
  version: v1.12.11
---
apiVersion: operator.cluster.x-k8s.io/v1alpha2
kind: InfrastructureProvider
metadata:
  name: openstack
  namespace: capo-system
spec:
  # renovate: datasource=github-releases depName=kubernetes-sigs/cluster-api-provider-openstack
  version: v0.14.8
---
apiVersion: operator.cluster.x-k8s.io/v1alpha2
kind: BootstrapProvider
metadata:
  name: talos
  namespace: cabpt-system
spec:
  # renovate: datasource=github-releases depName=siderolabs/cluster-api-bootstrap-provider-talos
  version: v0.6.12
  fetchConfig:
    url: https://github.com/siderolabs/cluster-api-bootstrap-provider-talos/releases/download/v0.6.12/bootstrap-components.yaml
  # Upstream manifests already drop caps and run as 65532 but don't set runAsNonRoot
  # or a seccomp profile, which PodSecurity "restricted" (enforced on the namespace)
  # requires. RFC 7396 merge patch applied by the operator to the rendered manifests.
  manifestPatches:
    - |
      apiVersion: apps/v1
      kind: Deployment
      spec:
        template:
          spec:
            securityContext:
              runAsNonRoot: true
              seccompProfile:
                type: RuntimeDefault
---
apiVersion: operator.cluster.x-k8s.io/v1alpha2
kind: ControlPlaneProvider
metadata:
  name: talos
  namespace: cacppt-system
spec:
  # renovate: datasource=github-releases depName=siderolabs/cluster-api-control-plane-provider-talos
  version: v0.5.13
  fetchConfig:
    url: https://github.com/siderolabs/cluster-api-control-plane-provider-talos/releases/download/v0.5.13/control-plane-components.yaml
  # Upstream manifests already drop caps and run as 65532 but don't set runAsNonRoot
  # or a seccomp profile, which PodSecurity "restricted" (enforced on the namespace)
  # requires. RFC 7396 merge patch applied by the operator to the rendered manifests.
  manifestPatches:
    - |
      apiVersion: apps/v1
      kind: Deployment
      spec:
        template:
          spec:
            securityContext:
              runAsNonRoot: true
              seccompProfile:
                type: RuntimeDefault
